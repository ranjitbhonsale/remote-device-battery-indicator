name: Deploy to Google Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Publish to Google Play Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if SIGNING_KEY secret is present)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > app/release.jks
          fi

      - name: Build Release Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Publish Android App Bundle to Google Play Store
        uses: rstudio/actions/play-store-publish@v1
        with:
          service-account-json: ${{ secrets.SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON || secrets.GOOGLE_PLAY_KEY }}
          package-name: work.ranjit.batteryntfy
          aab-file-path: app/build/outputs/bundle/release/app-release.aab
          track: production
