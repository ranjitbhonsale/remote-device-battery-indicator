name: Deploy to Google Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Publish to Google Play Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Successfully decoded release keystore into app/release.jks"
          else
            echo "WARNING: Keystore secret not found."
          fi

      - name: Build Release Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app/release.jks" ]; then
            ./gradlew bundleRelease -Pandroid.injected.signing.store.file="$(pwd)/app/release.jks" -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD" --no-daemon
          else
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Client
        run: python -m pip install --upgrade google-api-python-client google-auth google-auth-httplib2

      - name: Publish Android App Bundle to Google Play Store
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY || secrets.SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON || secrets.GOOGLE_PLAY_KEY }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "$PLAY_JSON" > service_account.json
            python3 -c "
          import os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = service_account.Credentials.from_service_account_file(
              'service_account.json',
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'work.ranjit.batteryntfy'

          edit = service.edits().insert(packageName=pkg, body={}).execute()
          edit_id = edit['id']
          print(f'Created Play Store edit ID: {edit_id}')

          media = MediaFileUpload('app/build/outputs/bundle/release/app-release.aab', mimetype='application/octet-stream')
          bundle = service.edits().bundles().upload(packageName=pkg, editId=edit_id, media_body=media).execute()
          vcode = bundle['versionCode']
          print(f'Uploaded AAB version code: {vcode}')

          service.edits().tracks().update(
              packageName=pkg,
              editId=edit_id,
              track='internal',
              body={'track': 'internal', 'releases': [{'versionCodes': [str(vcode)], 'status': 'completed'}]}
          ).execute()

          service.edits().commit(packageName=pkg, editId=edit_id).execute()
          print('Successfully committed release to Google Play Store Internal Track!')
          "
          else
            echo "PLAY_STORE_JSON_KEY secret not set. Skipping API upload."
          fi
